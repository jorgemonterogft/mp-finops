<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso protegido | Pluto 360</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f6f7;
      --card: #ffffff;
      --text: #2d373d;
      --subtext: #526570;
      --error: #da2a2a;
      --accent: #df0027;
      --border: #d8dfe4;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      font-family: 'DM Sans', system-ui, sans-serif;
      color: var(--text);
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 10px 26px rgba(82, 101, 112, 0.12);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      font-weight: 700;
    }

    p {
      margin: 0 0 20px;
      color: var(--subtext);
      font-size: 14px;
      line-height: 1.45;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--subtext);
    }

    input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 12px;
      font: inherit;
      margin-bottom: 14px;
    }

    button {
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .error {
      min-height: 20px;
      margin-top: 10px;
      color: var(--error);
      font-size: 13px;
    }

    .hint {
      margin-top: 12px;
      color: var(--subtext);
      font-size: 12px;
    }
  </style>
  <script src="auth.js" defer></script>
</head>
<body>
  <main class="login-card">
    <h1>Acceso protegido</h1>
    <p>Esta demo de GitHub Pages requiere contraseña para entrar.</p>

    <form id="login-form" autocomplete="off">
      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="Introduce la contraseña" required />
      <button type="submit">Entrar</button>
      <div id="login-error" class="error" aria-live="polite"></div>
    </form>

    <div class="hint">Contraseña inicial: <strong>pluto360</strong> (cámbiala en <code>auth.js</code>).</div>
  </main>
</body>
</html>
